<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0818">
<title>FPL Consensus Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Outfit:wght@400;500;600&family=Martian+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-tab="home">
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CF0A0"/><stop offset="1" stop-color="#3DDCF0"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="12" fill="url(#lg)"/><circle cx="20" cy="20" r="7" fill="none" stroke="#14081F" stroke-width="2.6"/><circle cx="20" cy="20" r="13" fill="none" stroke="#14081F" stroke-width="1.4" stroke-dasharray="3 4"/></svg>
      <div><b>Consensus Hub</b><small>FPL · <span id="season">2026/27</span></small></div>
    </div>
    <div class="gw glass" id="gwPill"><i></i><span>LOADING</span></div>
  </header>

  <main>
    <section class="screen on" data-screen="home" id="home"></section>
    <section class="screen" data-screen="creators" id="creators"></section>
    <section class="screen" data-screen="team" id="team"></section>
    <section class="screen" data-screen="players" id="players"></section>
  </main>
</div>

<nav class="dock glass" id="dock" aria-label="Sections">
  <span class="ind" id="ind"></span>
  <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-go="creators"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5.5" width="13" height="13" rx="3"/><path d="M15.5 10.5 21 7.5v9l-5.5-3"/></svg>Creators</button>
  <button data-go="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3 3.5 6l2 4.5L8 9.5V21h8V9.5l2.5 1 2-4.5L16 3a4 4 0 0 1-8 0z"/></svg>Team</button>
  <button data-go="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Players</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Player"></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Creator story"></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
